<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Founder BI</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #172554; background: #f8fafc; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(120deg,#eff6ff,#f8fafc 45%,#ecfdf5); }
      main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 54px 0; }
      header { margin-bottom: 25px; } h1 { font-size: clamp(2rem,5vw,3.5rem); margin: 0; letter-spacing:-.04em; }
      header p { color:#475569; font-size:1.1rem; max-width:620px; line-height:1.6; }
      .card { background:white; border:1px solid #dbeafe; border-radius:20px; box-shadow:0 18px 45px #1e3a5f12; padding:22px; }
      #conversation { min-height:210px; display:grid; gap:14px; margin-bottom:18px; }
      .bubble { padding:15px 17px; border-radius:14px; line-height:1.55; white-space:pre-wrap; max-width:88%; }
      .assistant { background:#eff6ff; color:#1e3a8a; } .user { background:#172554; color:white; justify-self:end; }
      form { display:flex; gap:10px; } input { flex:1; border:1px solid #94a3b8; padding:15px; border-radius:12px; font:inherit; }
      button { border:0; background:#2563eb; color:white; border-radius:12px; padding:0 19px; cursor:pointer; font:600 1rem inherit; }
      button:hover { background:#1d4ed8; } button:disabled { opacity:.6; cursor:wait; }
      .prompts { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0; } .prompts button { background:#f1f5f9; color:#334155; padding:9px 11px; font-size:.86rem; }
      #quality { color:#64748b; font-size:.82rem; margin-top:14px; } .error { background:#fef2f2; color:#991b1b; }
    </style>
  </head>
  <body>
    <main>
      <header><p>Live monday.com intelligence</p><h1>Founder BI</h1><p>Ask a business question across the Deals and Work Orders boards. Your data is read live and never changed.</p></header>
      <section class="card">
        <div id="conversation"><div class="bubble assistant">What would you like to know? Try a suggested question below.</div></div>
        <form id="chat-form"><input id="question" placeholder="How is our energy-sector pipeline this quarter?" autocomplete="off" /><button id="send" type="submit">Ask</button></form>
        <div class="prompts">
          <button type="button" data-question="How is our pipeline looking for the energy sector this quarter?">Energy pipeline</button>
          <button type="button" data-question="Which deals appear to be at risk and why?">Deals at risk</button>
          <button type="button" data-question="Which work orders need leadership attention?">Work order risks</button>
          <button type="button" data-question="Create a concise leadership update across sales and operations.">Leadership update</button>
        </div>
        <div id="quality"></div>
      </section>
    </main>
    <script>
      const form = document.querySelector('#chat-form'); const input = document.querySelector('#question'); const messages = document.querySelector('#conversation'); const send = document.querySelector('#send'); const quality = document.querySelector('#quality');
      function addMessage(text, type) { const item = document.createElement('div'); item.className = `bubble ${type}`; item.textContent = text; messages.appendChild(item); item.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
      async function submitQuestion(question) { if (!question.trim()) return; addMessage(question, 'user'); input.value=''; send.disabled=true; send.textContent='Thinking…'; quality.textContent=''; try { const result = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question}) }); const data = await result.json(); if (!result.ok) throw new Error(data.error); addMessage(data.answer, 'assistant'); const issues = Object.entries(data.dataQuality).filter(([,value]) => value > 0).map(([key,value]) => `${key.replaceAll('_',' ')}: ${value}`); quality.textContent = issues.length ? `Data quality notes — ${issues.join(' · ')}` : 'Data quality checks passed for the fields used.'; } catch(error) { addMessage(error.message || 'Unable to answer right now.', 'error'); } finally { send.disabled=false; send.textContent='Ask'; input.focus(); } }
      form.addEventListener('submit', (event) => { event.preventDefault(); submitQuestion(input.value); }); document.querySelectorAll('[data-question]').forEach(button => button.addEventListener('click', () => submitQuestion(button.dataset.question)));
    </script>
  </body>
</html>
